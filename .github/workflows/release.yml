name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # check-no-secrets.sh reads every commit; a shallow clone would only
          # let it see the tag.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          # The interpreter the servers run. A release is not allowed to be
          # green on a newer one and broken on that.
          python-version: "3.9"
      - name: suite, smoke and the cron wrapper
        run: bash scripts/smoke.sh
        env:
          PYTHON: python
      - name: nothing deployment-specific in the tarball
        run: bash scripts/check-no-secrets.sh
      - name: build, checking the tag against the tree
        run: bash scripts/release.sh "${GITHUB_REF_NAME}"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/mail-sentinel-${version}.tar.gz" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "dist/notes-${version}.md"
