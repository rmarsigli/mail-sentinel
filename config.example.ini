; mail-sentinel configuration. Copy to /etc/mail-sentinel/config.ini, chmod 0600.
; Every key below is shown with its default. Sections and keys not listed here
; are rejected at startup so typos fail loudly.

[server]
; Label used in alert subjects. Usually the mail hostname.
name = mx1.example.com
maillog = /var/log/maillog
exim_mainlog = /var/log/exim_mainlog
state_dir = /var/lib/mail-sentinel
log_file = /var/log/mail-sentinel.log

[provider]
; brevo | resend
kind = brevo
; File containing only the API key. Must be mode 0600, owned by root.
api_key_file = /etc/mail-sentinel/api.key
; Sender address; its domain must be verified at the provider.
from = alerts@example.com

[recipients]
; Comma-separated. An alert goes to the list of its own severity only.
critical = ops@example.com
high = ops@example.com
medium = ops@example.com

[brute_force]
; IP with at least min_failures in window_minutes and no successful login in 24 h.
min_failures = 20
window_minutes = 15

[locked_out]
; Account with at least min_failures in window_minutes and no successful login in 24 h.
min_failures = 10
window_minutes = 60

[sending]
; Alert when an account's accepted messages in the last closed hour exceed
; ceiling_per_hour, or exceed baseline_multiplier times its 7-day hourly mean.
; The baseline rule needs baseline_min_hours of collected history and a mean
; of at least baseline_floor.
ceiling_per_hour = 100
baseline_multiplier = 5
baseline_min_hours = 72
baseline_floor = 2

[dedup]
; Hours before the same brute_force IP / locked_out account can alert again.
brute_force_hours = 24
locked_out_hours = 24

[overrides]
; Per-account sending thresholds: address = key=value[, key=value]
; newsletter@example.com = ceiling_per_hour=2000, baseline_multiplier=10
